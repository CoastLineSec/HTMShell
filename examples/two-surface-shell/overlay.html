<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HTMShell transient overlay experiment</title>
    <link rel="stylesheet" href="overlay.css">
  </head>
  <body>
    <main id="overlay-root">
      <section id="overlay-card" class="overlay-card">
        <div class="card-header">
          <div>
            <p class="eyebrow">INDEPENDENT LAYER SURFACE</p>
            <h1>Portable overlay</h1>
          </div>
          <button id="overlay-close" type="button" aria-label="Close overlay">Close</button>
        </div>
        <p id="overlay-status">Activated 0 time(s) · Opened from panel</p>
        <div class="clip-window"><div class="clip-accent"></div></div>
        <button id="overlay-action" type="button">Mutate overlay state</button>
      </section>
    </main>
  </body>
</html>
