<!doctype html>
<template data-htm-component="badge-label">
  <img class="package-badge-icon" src="resource:badge-icon" alt="">
  <img class="package-badge-symbol" src="resource:badge-symbol" alt="">
  <span
    class="package-badge"
    data-htm-element="state-text"
    data-htm-bind="input.label"></span>
  <span
    class="package-badge-state"
    data-htm-element="state-token"
    data-htm-bind="input.tone"></span>
</template>

<template data-htm-component="unstyled-note">
  <span class="unstyled-boundary">Unstyled child scope boundary</span>
</template>

<template data-htm-component="resource-image">
  <img class="package-passed-image" src="input:icon" alt="">
</template>
