<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HTMShell package graph panel</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main id="panel-root" class="panel">
      <strong>Local package graph</strong>
      <htm-use
        component="shared.badge-label"
        input-label="Literal inputs active"
        input-tone="active"></htm-use>
      <htm-use
        component="controls.resource-showcase"
        input-photo="resource:surface-photo"
        input-symbol="resource:surface-symbol">
        <img class="projected-raster" src="assets/root-projected.png" alt="">
      </htm-use>
      <htm-use
        component="controls.resource-showcase"
        input-photo="resource:surface-photo"
        input-symbol="resource:surface-symbol"></htm-use>
      <htm-use
        component="controls.state-dashboard"
        input-time="state:current-time">
        <span
          id="projected-clock-time"
          class="projected-status"
          data-htm-element="state-text"
          data-htm-bind="clock.time">Caller-scoped time</span>
      </htm-use>
      <htm-use
        component="controls.state-dashboard"
        input-time="state:current-time"></htm-use>
      <span class="literal-state-sibling">Literal sibling</span>
      <span id="output-label" data-htm-element="state-text" data-htm-bind="output.label">Output</span>
      <button
        id="overlay-toggle"
        type="button"
        data-htm-element="action-button"
        data-htm-action="overlay.toggle">Details</button>
    </main>
  </body>
</html>
