<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HTMShell package graph overlay</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main id="overlay-root">
      <section id="overlay-card" class="card">
        <h1>Validated local dependencies</h1>
        <htm-use
          component="controls.status-card"
          input-label="Overlay package snapshot"
          input-count="2"
          input-tone="active">
          <p class="projected-status">Overlay-owned projected content.</p>
        </htm-use>
        <htm-use
          component="controls.resource-showcase"
          input-photo="resource:surface-photo"
          input-symbol="resource:surface-symbol"></htm-use>
        <p id="overlay-status" data-htm-element="state-text" data-htm-bind="overlay.status">Overlay</p>
        <button
          id="overlay-action"
          type="button"
          data-htm-element="action-button"
          data-htm-action="overlay.activate">Update</button>
        <button
          id="overlay-close"
          type="button"
          data-htm-element="action-button"
          data-htm-action="overlay.close">Close</button>
      </section>
    </main>
  </body>
</html>
