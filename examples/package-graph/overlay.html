<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HTMShell package graph overlay</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main id="overlay-root">
      <section id="overlay-card" class="card">
        <h1>Validated local dependencies</h1>
        <p id="overlay-status" data-htm-element="state-text" data-htm-bind="overlay.status">Overlay</p>
        <p>Library manifests are validated but provide no visual exports.</p>
        <button
          id="overlay-action"
          type="button"
          data-htm-element="action-button"
          data-htm-action="overlay.activate">Update</button>
        <button
          id="overlay-close"
          type="button"
          data-htm-element="action-button"
          data-htm-action="overlay.close">Close</button>
      </section>
    </main>
  </body>
</html>
