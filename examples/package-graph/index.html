<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HTMShell local package graph</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="headless-card">
      <h1>Local package graph</h1>
      <htm-use
        component="controls.status-card"
        input-label="Defaulted package snapshot"></htm-use>
      <htm-use
        component="controls.status-card"
        input-label="Explicit literal inputs"
        input-count="3"
        input-enabled="false"
        input-tone="active"
        input-accent="rgb(124 196 255)"
        input-spacing="10px">
        <span class="projected-icon" slot="icon">✓</span>
        <img class="projected-raster" src="assets/root-projected.png" alt="">
        <p class="projected-status">Caller-owned assigned content.</p>
        <htm-use
          component="shared.badge-label"
          slot="footer"
          input-label="Nested component projected by the root"
          input-tone="ready"></htm-use>
      </htm-use>
      <htm-use component="controls.required-frame">
        <strong slot="heading">Named required content</strong>
        <p class="projected-status" slot="content">The required content slot is satisfied.</p>
      </htm-use>
      <htm-use
        component="controls.projected-label"
        input-label="Parent input scope survives nested projection"></htm-use>
      <htm-use component="controls.intrinsic-image"></htm-use>
    </main>
  </body>
</html>
