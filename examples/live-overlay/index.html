<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HTMShell live overlay experiment</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main id="overlay-root">
      <section id="shell-card" class="shell-card">
        <p class="eyebrow">PORTABLE WAYLAND PRESENTATION</p>
        <h1>HTMShell live overlay</h1>
        <p id="status-label" class="status-label">Ready for pointer input</p>
        <div class="clip-window">
          <div class="clip-accent"></div>
        </div>
        <button id="primary-action" class="primary-action" type="button">
          Activate shell state
        </button>
      </section>
    </main>
  </body>
</html>
