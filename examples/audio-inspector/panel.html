<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="panel-root" class="panel">
    <strong>PipeWire</strong>
    <span id="availability"
          data-htm-element="state-token"
          data-htm-bind="pipewire.availability">
      <span id="availability-text"
            data-htm-element="state-text"
            data-htm-bind="pipewire.availability"></span>
    </span>
    <span class="default-label">Output:</span>
    <span id="default-output"
          data-htm-element="state-text"
          data-htm-bind="pipewire.default_sink.description"></span>
    <data id="default-output-volume"
          data-htm-element="state-value"
          data-htm-bind="pipewire.default_sink.volume"
          data-htm-format="percent"></data>
    <span id="default-output-mute"
          data-htm-element="state-token"
          data-htm-bind="pipewire.default_sink.mute_state"></span>
    <button id="overlay-toggle"
            data-htm-element="action-button"
            data-htm-action="overlay.toggle">Inspect graph</button>
  </main>
</body>
</html>
