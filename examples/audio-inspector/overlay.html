<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="overlay-card" class="inspector">
    <header class="inspector-header">
      <div>
        <p class="eyebrow">PipeWire graph</p>
        <h1>Audio and media inspector</h1>
      </div>
      <button id="overlay-close"
              data-htm-element="action-button"
              data-htm-action="overlay.close">Close</button>
    </header>

    <section class="summary">
      <div>
        <span>State</span>
        <span id="graph-state"
              data-htm-element="state-token"
              data-htm-bind="pipewire.availability">
          <span id="graph-state-text"
                data-htm-element="state-text"
                data-htm-bind="pipewire.availability"></span>
        </span>
      </div>
      <div>
        <span>Nodes</span>
        <data id="node-count"
              data-htm-element="state-value"
              data-htm-bind="pipewire.node_count"></data>
      </div>
      <div>
        <span>Actual output</span>
        <span id="actual-output"
              data-htm-element="state-text"
              data-htm-bind="pipewire.default_sink.description"></span>
        <div id="actual-output-audio"
             class="audio-summary"
             data-htm-element="state-token"
             data-htm-bind="pipewire.default_sink.audio_status">
          <data id="actual-output-volume"
                data-htm-element="state-value"
                data-htm-bind="pipewire.default_sink.volume"
                data-htm-format="percent"></data>
          <span id="actual-output-mute"
                data-htm-element="state-token"
                data-htm-bind="pipewire.default_sink.mute_state"></span>
        </div>
      </div>
      <div>
        <span>Configured output</span>
        <span id="configured-output"
              data-htm-element="state-text"
              data-htm-bind="pipewire.configured_sink.description"></span>
      </div>
      <div>
        <span>Actual input</span>
        <span id="actual-input"
              data-htm-element="state-text"
              data-htm-bind="pipewire.default_source.description"></span>
        <div id="actual-input-audio"
             class="audio-summary"
             data-htm-element="state-token"
             data-htm-bind="pipewire.default_source.audio_status">
          <data id="actual-input-volume"
                data-htm-element="state-value"
                data-htm-bind="pipewire.default_source.volume"
                data-htm-format="percent"></data>
          <span id="actual-input-mute"
                data-htm-element="state-token"
                data-htm-bind="pipewire.default_source.mute_state"></span>
        </div>
      </div>
      <div>
        <span>Configured input</span>
        <span id="configured-input"
              data-htm-element="state-text"
              data-htm-bind="pipewire.configured_source.description"></span>
      </div>
    </section>

    <section class="default-controls">
      <article>
        <h2>Default output</h2>
        <input id="default-output-range"
               type="range"
               data-htm-element="range-control"
               data-htm-bind="pipewire.default_sink.volume"
               data-htm-action="pipewire.audio.set_volume"
               data-htm-target="pipewire.default_sink"
               data-htm-enabled-bind="pipewire.default_sink.can_set_volume"
               min="0"
               max="1"
               step="0.01">
        <button id="default-output-toggle"
                data-htm-element="action-button"
                data-htm-action="pipewire.audio.toggle_mute"
                data-htm-target="pipewire.default_sink"
                data-htm-enabled-bind="pipewire.default_sink.can_set_mute">Toggle mute</button>
      </article>
      <article>
        <h2>Default input</h2>
        <input id="default-input-range"
               type="range"
               data-htm-element="range-control"
               data-htm-bind="pipewire.default_source.volume"
               data-htm-action="pipewire.audio.set_volume"
               data-htm-target="pipewire.default_source"
               data-htm-enabled-bind="pipewire.default_source.can_set_volume"
               min="0"
               max="1"
               step="0.01">
        <button id="default-input-toggle"
                data-htm-element="action-button"
                data-htm-action="pipewire.audio.toggle_mute"
                data-htm-target="pipewire.default_source"
                data-htm-enabled-bind="pipewire.default_source.can_set_mute">Toggle mute</button>
      </article>
    </section>

    <section>
      <h2>Discovered nodes</h2>
      <div class="node-grid">
        <template id="node-card"
                  data-htm-element="repeat"
                  data-htm-source="pipewire.nodes">
          <div class="node"
               data-htm-element="state-token"
               data-htm-local-id="type"
               data-htm-bind="item.node_type">
            <div class="node-heading">
              <div>
                <span class="node-type"
                      data-htm-element="state-text"
                      data-htm-local-id="type-text"
                      data-htm-bind="item.node_type"></span>
                <h3><span data-htm-element="state-text"
                          data-htm-local-id="description"
                          data-htm-bind="item.description"></span></h3>
              </div>
              <data data-htm-element="state-value"
                    data-htm-local-id="raw-id"
                    data-htm-bind="item.raw_id"></data>
            </div>
            <dl>
              <dt>Name</dt>
              <dd><span data-htm-element="state-text"
                        data-htm-local-id="name"
                        data-htm-bind="item.name"></span></dd>
              <dt>Media class</dt>
              <dd><span data-htm-element="state-text"
                        data-htm-local-id="media-class"
                        data-htm-bind="item.media_class"></span></dd>
              <dt>State</dt>
              <dd><span data-htm-element="state-token"
                        data-htm-local-id="state"
                        data-htm-bind="item.node_state">
                <span data-htm-element="state-text"
                      data-htm-local-id="state-text"
                      data-htm-bind="item.node_state"></span>
              </span></dd>
              <dt>Direction</dt>
              <dd><span data-htm-element="state-text"
                        data-htm-local-id="direction"
                        data-htm-bind="item.direction"></span></dd>
              <dt>Application</dt>
              <dd><span data-htm-element="state-token"
                        data-htm-local-id="application-state"
                        data-htm-bind="item.property"
                        data-htm-property-key="application.name">
                <span data-htm-element="state-text"
                      data-htm-local-id="application"
                      data-htm-bind="item.property"
                      data-htm-property-key="application.name"></span>
              </span></dd>
              <dt>Media title</dt>
              <dd><span data-htm-element="state-text"
                        data-htm-local-id="media-title"
                        data-htm-bind="item.property"
                        data-htm-property-key="media.title"></span></dd>
            </dl>
            <div class="node-audio"
                 data-htm-element="state-token"
                 data-htm-local-id="audio-status"
                 data-htm-bind="item.audio_status">
              <div class="audio-reading">
                <data data-htm-element="state-value"
                      data-htm-local-id="volume"
                      data-htm-bind="item.volume"
                      data-htm-format="percent"></data>
                <span data-htm-element="state-token"
                      data-htm-local-id="mute-state"
                      data-htm-bind="item.mute_state"></span>
              </div>
              <input type="range"
                     data-htm-element="range-control"
                     data-htm-local-id="volume-control"
                     data-htm-bind="item.volume"
                     data-htm-action="pipewire.audio.set_volume"
                     data-htm-enabled-bind="item.can_set_volume"
                     min="0"
                     max="1"
                     step="0.01">
              <button data-htm-element="action-button"
                      data-htm-local-id="mute-control"
                      data-htm-action="pipewire.audio.toggle_mute"
                      data-htm-enabled-bind="item.can_set_mute">Toggle mute</button>
            </div>
            <footer>
              <span data-htm-element="state-token"
                    data-htm-local-id="default-role"
                    data-htm-bind="item.default_role"></span>
              <span data-htm-element="state-token"
                    data-htm-local-id="configured-role"
                    data-htm-bind="item.configured_role"></span>
              <span data-htm-element="state-token"
                    data-htm-local-id="audio"
                    data-htm-bind="item.is_audio"></span>
              <span data-htm-element="state-token"
                    data-htm-local-id="video"
                    data-htm-bind="item.is_video"></span>
              <span data-htm-element="state-token"
                    data-htm-local-id="stream"
                    data-htm-bind="item.is_stream"></span>
            </footer>
          </div>
        </template>
      </div>
    </section>
    <footer class="overlay-footer">
      <button id="overlay-action"
              data-htm-element="action-button"
              data-htm-action="overlay.activate">Refresh local state</button>
      <span id="overlay-status"
            data-htm-element="state-text"
            data-htm-bind="overlay.status"></span>
      <span id="activation-count"
            data-htm-element="state-text"
            data-htm-bind="overlay.activation_count"></span>
    </footer>
  </main>
</body>
</html>
