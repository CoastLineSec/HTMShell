<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HTMShell manifest overlay experiment</title>
    <link rel="stylesheet" href="overlay.css">
  </head>
  <body>
    <main id="overlay-root">
      <section id="overlay-card" class="overlay-card">
        <div class="card-header">
          <div>
            <p class="eyebrow"><span id="surface-id-label">overlay</span> · <span id="output-label">output</span></p>
            <h1>Output-scoped overlay</h1>
          </div>
          <button id="overlay-close" type="button">Close</button>
        </div>
        <p id="overlay-status">Activated 0 time(s) · Ready</p>
        <div class="clip-window"><div class="clip-accent"></div></div>
        <button id="overlay-action" type="button">Mutate this output</button>
      </section>
    </main>
  </body>
</html>
