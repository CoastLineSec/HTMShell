<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HTMShell manifest panel experiment</title>
    <link rel="stylesheet" href="panel.css">
  </head>
  <body>
    <main id="panel-root" class="panel">
      <section class="panel-left">
        <strong>HTMShell</strong>
        <span id="surface-id-label">panel</span>
      </section>
      <section class="panel-center">
        <span id="output-label">output</span>
        <span id="panel-status">Overlay closed · Ready</span>
      </section>
      <section class="panel-right">
        <button id="overlay-toggle" type="button">Toggle this output</button>
      </section>
    </main>
  </body>
</html>
