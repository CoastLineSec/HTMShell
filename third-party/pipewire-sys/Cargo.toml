[package]
edition = "2021"
rust-version = "1.80"
name = "pipewire-sys"
version = "0.10.0"
authors = [
    "Tom Wagner <tom.a.wagner@protonmail.com>",
    "Guillaume Desmottes <guillaume.desmottes@collabora.com>",
]
build = "build.rs"
links = "pipewire-0.3"
description = "Rust FFI bindings for PipeWire"
homepage = "https://pipewire.org"
documentation = "https://pipewire.pages.freedesktop.org/pipewire-rs/pipewire_sys/"
readme = "README.md"
keywords = ["ffi", "pipewire", "multimedia", "audio", "video"]
categories = ["api-bindings", "multimedia"]
license = "MIT"
repository = "https://gitlab.freedesktop.org/pipewire/pipewire-rs"

[package.metadata.system-deps.libpipewire]
name = "libpipewire-0.3"
version = "0.3"

[lib]
name = "pipewire_sys"
path = "src/lib.rs"
doctest = false

[dependencies.spa_sys]
version = "0.10"
package = "libspa-sys"

[build-dependencies.bindgen]
version = "0.72.0"
features = ["runtime"]
default-features = false

[build-dependencies.system-deps]
version = "7.0.5"
