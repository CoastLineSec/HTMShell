[workspace]
members = [
    "crates/htm-runtime",
    "crates/htm-shell-host",
    "tools/htm-headless",
    "tools/htmshell-live",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
anyrender = { version = "=0.11.0" }
anyrender_vello_cpu = { version = "=0.14.0", default-features = false }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "389e3762fc0ac19f6de7c0cec7201d0c8bde393a", default-features = false, features = ["incremental", "svg", "system-fonts"] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "389e3762fc0ac19f6de7c0cec7201d0c8bde393a", default-features = false }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "389e3762fc0ac19f6de7c0cec7201d0c8bde393a", default-features = false, features = ["svg"] }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "389e3762fc0ac19f6de7c0cec7201d0c8bde393a", default-features = false }
cssparser = "=0.37.0"
dbus = { version = "=0.9.12", default-features = false }
kurbo = "=0.13.1"
jiff = { version = "=0.2.28", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
memmap2 = "=0.9.11"
png = "=0.18.1"
pipewire = { version = "=0.10.0", default-features = false }
rustix = { version = "=1.1.4", features = ["fs"] }
selectors = "=0.39.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
skrifa = "=0.42.1"
stylo = { version = "=0.19.0", package = "stylo" }
url = "=2.5.8"
wayland-client = { version = "=0.31.14" }
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "=0.3.12", default-features = false, features = ["client"] }

[profile.release]
strip = false

[patch.crates-io]
libspa-sys = { path = "third-party/libspa-sys" }
pipewire-sys = { path = "third-party/pipewire-sys" }
